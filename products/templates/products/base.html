<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{%block title%}Product Management {% endblock%}</title>
  <script>
  (function () {
    const media = window.matchMedia("(prefers-color-scheme: dark)");
    const applyTheme = () =>
      document.documentElement.setAttribute("data-bs-theme", media.matches ? "dark" : "light");
    applyTheme();
    media.addEventListener("change", applyTheme);  // follows live changes in Windows
  })();
</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
  /* Light mode: pick your own colors here */
  [data-bs-theme="light"] {
    --bs-body-bg: #eef2ff;      /* page background */
    --bs-body-color: #1f2937;   /* text color */
    --app-surface: #ffffff;     /* cards and boxes */
  }

  /* Dark mode */
  [data-bs-theme="dark"] {
    --bs-body-bg: #111827;
    --bs-body-color: #e5e7eb;
    --app-surface: #1f2937;
  }

  .card { --bs-card-bg: var(--app-surface); }
  .surface { background-color: var(--app-surface); }
</style>

</head>
<body class="d-flex flex-column min-vh-100 ">
  <nav class="navbar navbar-dark bg-dark text-light mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'products:list' %}">Product Management</a>
    </div>
  </nav>
  <main class="container mb-4">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>


  {% include "products/includes/footer.html" %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
